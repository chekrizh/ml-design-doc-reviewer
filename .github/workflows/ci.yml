# Tests on every push and PR; on main, then deploys the database and edge functions (D35):
# staging at once, production after a manual approval (GitHub environment "production").
# The frontend is deployed by Vercel's Git integration (Preview → staging, Production → prod).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12.8.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - uses: supabase/setup-cli@v1
        with: { version: 2.119.0 }
      - run: supabase start
      - run: pnpm test:db
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-results, path: test-results, retention-days: 7 }

  deploy-staging:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy.yml
    with: { environment: staging, prefix: STAGING }
    secrets: inherit

  deploy-production:
    needs: deploy-staging
    uses: ./.github/workflows/deploy.yml
    with: { environment: production, prefix: PROD }
    secrets: inherit
