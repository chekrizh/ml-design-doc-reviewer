<meta charset="utf-8">
<title>Google Docs Export Mockup</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* App is light-only (docs/design-system.md), so the mockup commits to one theme. */
  :root { color-scheme: light; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { background: #f8fafc; color: #334155; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { animation: spin 1s linear infinite; }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>

<div class="flex h-full flex-col">

<!-- Mockup-only: scene switcher. Not part of the app. -->
<div class="relative z-50 border-b border-dashed border-slate-300 bg-white px-4 py-2 text-xs text-slate-500">
  <div id="scenes" class="flex flex-wrap items-center gap-1"></div>
</div>

<header class="relative flex shrink-0 items-center gap-4 border-b border-slate-200 bg-white px-6 py-3">
  <div class="flex min-w-0 flex-1 items-center gap-3">
    <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-slate-900 text-white">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="1.5" y="1.5" width="5" height="5" rx="1"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><path d="M4 6.5v5.5h5.5"/></svg>
    </div>
    <h1 class="truncate text-lg font-semibold text-slate-900">Supermegaretail Demand Forecasting</h1>
    <span class="shrink-0 text-xs text-slate-400">Saved</span>
  </div>
  <div class="flex rounded-lg bg-slate-100 p-1 text-sm">
    <span class="rounded-md px-3 py-1 text-slate-500">Canvas</span>
    <span class="rounded-md bg-white px-3 py-1 font-medium text-slate-900 shadow-sm">Document</span>
  </div>
  <div class="flex flex-1 items-center justify-end gap-2">
    <span class="mr-2 grid h-8 w-8 place-items-center rounded-full bg-indigo-100 text-sm font-semibold text-indigo-700" title="Google profile photo">A</span>
    <button class="rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-sm font-medium text-slate-900 hover:bg-slate-50">AI Review</button>
    <button id="share-btn" class="flex items-center gap-2 rounded-lg bg-slate-900 px-3 py-1.5 text-sm font-medium text-white hover:bg-slate-700">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4"><path d="M18 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM18 22a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
      Share
    </button>
    <button class="rounded-lg border border-slate-200 bg-white px-2.5 py-1.5 text-sm font-medium leading-none text-slate-900 hover:bg-slate-50">⋯</button>
  </div>
  <!-- Share menu: M1 Menu popover -->
  <div id="menu" class="absolute top-full right-14 z-30 mt-1 w-72 rounded-xl border border-slate-200 bg-white p-1 text-sm shadow-lg"></div>
</header>

<!-- Document behind, as in document mode -->
<main class="min-h-0 flex-1 overflow-hidden">
  <div class="mx-auto flex max-w-[1400px] gap-6 px-6 py-8">
    <nav class="hidden w-64 shrink-0 lg:block">
      <h2 class="mb-3 text-xs font-semibold uppercase tracking-wide text-slate-400">On this page</h2>
      <ul class="space-y-1 text-sm">
        <li class="rounded-lg bg-indigo-100 px-3 py-2 font-medium text-indigo-700">Problem Space</li>
      </ul>
      <ul id="toc" class="mt-1 space-y-1 text-sm"></ul>
    </nav>
    <article class="min-w-0 flex-1 rounded-2xl bg-white px-16 py-14 shadow-sm">
      <h1 class="text-5xl font-bold tracking-tight text-slate-900">Supermegaretail Demand Forecasting</h1>
      <p class="mt-2 text-xl text-slate-500">ML System Architecture Spec</p>
      <h2 class="mt-12 border-b border-slate-100 pb-3 text-2xl font-semibold text-slate-900">1. Problem Space</h2>
      <div class="mt-5 flex flex-col gap-2 rounded-xl border border-slate-100 bg-slate-50 px-5 py-5">
        <span class="h-3 w-2/3 rounded bg-slate-200"></span><span class="h-3 w-1/2 rounded bg-slate-200"></span>
      </div>
      <div class="mt-5 flex flex-col gap-3">
        <span class="h-3 w-full rounded bg-slate-100"></span><span class="h-3 w-11/12 rounded bg-slate-100"></span><span class="h-3 w-4/5 rounded bg-slate-100"></span>
      </div>
    </article>
    <div class="w-80 shrink-0"></div>
  </div>
</main>
</div>

<!-- Toast: bottom center, one at a time. New component: see docs/design-system.md -->
<div id="toast" role="status" aria-live="polite" class="fixed bottom-6 left-1/2 z-40 w-[440px] max-w-[calc(100%-32px)] -translate-x-1/2"></div>

<script>
  const SCENES = [
    ['menu', 'Share menu'],
    ['waiting', 'Google window open'],
    ['exporting', 'Exporting'],
    ['done', 'Done'],
    ['menu-after', 'Share menu after export'],
    ['denied', 'Access not given'],
    ['blocked', 'Popup blocked'],
    ['failed', 'Drive error'],
  ];
  let scene = 'menu';

  const item = 'flex w-full items-center rounded-lg px-3 py-2 text-left font-medium hover:bg-slate-100';
  const spinner = '<svg class="spin h-4 w-4 shrink-0 text-indigo-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 3a9 9 0 1 0 9 9" stroke-linecap="round"/></svg>';
  const check = '<span class="grid h-5 w-5 shrink-0 place-items-center rounded-full bg-emerald-600 text-white"><svg viewBox="0 0 24 24" class="h-3 w-3"><path d="M6 12l4 4 8-8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
  const alertIcon = '<span class="grid h-5 w-5 shrink-0 place-items-center rounded-full bg-red-600 text-[11px] font-bold text-white">!</span>';
  const linkBtn = 'whitespace-nowrap text-sm font-semibold text-indigo-300 hover:text-indigo-200';
  const close = '<button class="ml-1 shrink-0 rounded-md px-1 text-slate-400 hover:text-white" aria-label="Dismiss">✕</button>';

  function renderMenu() {
    const m = document.getElementById('menu');
    m.hidden = !scene.startsWith('menu');
    if (m.hidden) return;
    const last = scene === 'menu-after'
      ? `<div class="mx-3 mb-1 flex items-center gap-2 border-t border-slate-100 pt-2 text-xs text-slate-500">
          <span>Last exported today, 14:05</span>
          <button class="ml-auto font-semibold text-indigo-600 hover:text-indigo-700">Open</button>
        </div>` : '';
    m.innerHTML = `
      <button class="${item} flex-col !items-start gap-0.5">
        <span>Export to Google Docs</span>
        <span class="text-xs font-normal text-slate-500">Creates a new Google Doc in your Drive</span>
      </button>
      <button class="${item}">Export PDF</button>
      <button class="${item}">Export Markdown</button>
      ${last}`;
  }

  function renderToast() {
    const t = document.getElementById('toast');
    const box = inner => `<div class="flex items-center gap-3 rounded-xl bg-slate-900 px-4 py-3 text-sm text-white shadow-lg">${inner}</div>`;
    const map = {
      waiting: box(`${spinner}<span class="flex-1">Continue in the Google window to let the app create the Doc.</span>`),
      exporting: box(`${spinner}<span class="flex-1">Exporting to Google Docs… <span class="text-slate-400">drawing diagrams</span></span>`),
      done: box(`${check}<span class="min-w-0 flex-1 truncate">Google Doc created</span>
        <button class="${linkBtn}">Open</button><button class="${linkBtn}">Copy link</button>${close}`),
      denied: box(`${alertIcon}<span class="flex-1">Export needs access to the files it creates in your Drive. Nothing was exported.</span>
        <button class="${linkBtn}">Try again</button>${close}`),
      blocked: box(`${alertIcon}<span class="flex-1">Your browser blocked the Google window. Allow pop-ups for this site and try again.</span>
        <button class="${linkBtn}">Try again</button>${close}`),
      failed: box(`${alertIcon}<span class="flex-1">Google Drive did not accept the document. Try again in a minute; PDF and Markdown export still work.</span>
        <button class="${linkBtn}">Try again</button>${close}`),
    };
    t.innerHTML = map[scene] || '';
    t.hidden = !map[scene];
  }

  function render() {
    document.getElementById('scenes').innerHTML = '<span class="mr-1 uppercase tracking-wide">Mockup scene</span>' + SCENES.map(([k, label]) =>
      `<button data-scene="${k}" class="rounded-lg px-2 py-1 font-medium ${k === scene ? 'bg-indigo-50 text-indigo-700' : 'text-slate-500 hover:bg-slate-100'}">${label}</button>`).join('');
    document.querySelectorAll('[data-scene]').forEach(b => b.onclick = () => { scene = b.dataset.scene; render(); });
    document.getElementById('share-btn').classList.toggle('ring-2', scene.startsWith('menu'));
    document.getElementById('share-btn').classList.toggle('ring-indigo-300', scene.startsWith('menu'));
    document.getElementById('toc').innerHTML = ['Evaluation (Offline)', 'Baseline', 'Validation', 'Data & Features', 'Evaluation (Online)', 'Integration', 'Monitoring', 'Target Solution & Architecture']
      .map(n => `<li class="rounded-lg px-3 py-2 text-slate-500">${n}</li>`).join('');
    renderMenu(); renderToast();
  }
  render();
</script>
