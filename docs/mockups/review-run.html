<meta charset="utf-8">
<title>Review Run Mockup</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* App is light-only (docs/design-system.md), so the mockup commits to one theme. */
  :root { color-scheme: light; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { background: #f8fafc; color: #334155; }
  @keyframes pulse-soft { 50% { opacity: .35; } }
  .running { animation: pulse-soft 1.4s ease-in-out infinite; }
  @keyframes bar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  .bar { animation: bar 1.6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .running, .bar { animation: none; } }
</style>

<div class="flex h-full flex-col">

<!-- Mockup-only: scene switcher. Not part of the app. -->
<div class="relative z-50 border-b border-dashed border-slate-300 bg-white px-4 py-2 text-xs text-slate-500">
  <div id="scenes" class="flex flex-wrap items-center gap-1"></div>
</div>

<header class="relative flex shrink-0 items-center gap-4 border-b border-slate-200 bg-white px-6 py-3">
  <div class="flex min-w-0 flex-1 items-center gap-3">
    <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-slate-900 text-white">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="1.5" y="1.5" width="5" height="5" rx="1"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><path d="M4 6.5v5.5h5.5"/></svg>
    </div>
    <h1 class="truncate text-lg font-semibold text-slate-900">Supermegaretail Demand Forecasting</h1>
    <span class="shrink-0 text-xs text-slate-400">Saved</span>
  </div>
  <div class="flex rounded-lg bg-slate-100 p-1 text-sm">
    <span class="rounded-md bg-white px-3 py-1 font-medium text-slate-900 shadow-sm">Canvas</span>
    <span class="rounded-md px-3 py-1 text-slate-500">Document</span>
  </div>
  <div class="flex flex-1 items-center justify-end gap-2">
    <span id="avatar"></span>
    <button id="ai-btn" class="rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-sm font-medium text-slate-900 hover:bg-slate-50">AI Review</button>
    <button class="rounded-lg bg-slate-900 px-3 py-1.5 text-sm font-medium text-white hover:bg-slate-700">Share</button>
  </div>
  <!-- AI Review menu (M1 Menu popover classes) -->
  <div id="menu" class="absolute top-full right-24 z-30 mt-1 w-80 rounded-xl border border-slate-200 bg-white p-1 text-sm shadow-lg"></div>
  <!-- Account menu -->
  <div id="account-menu" class="absolute top-full right-48 z-30 mt-1 min-w-44 rounded-xl border border-slate-200 bg-white p-1 text-sm shadow-lg"></div>
</header>

<div class="flex min-h-0 flex-1">
  <main class="min-w-0 flex-1 overflow-auto p-6">
    <div id="grid" class="grid min-w-[700px] grid-cols-12 gap-4"></div>
  </main>
  <aside id="panel" class="flex w-[420px] shrink-0 flex-col border-l border-slate-200 bg-white"></aside>
</div>
</div>

<!-- Settings: the design-system dialog, wider for the form -->
<div id="settings-wrap" class="fixed inset-0 z-40 grid place-items-center bg-slate-900/30 p-4">
  <div role="dialog" aria-labelledby="settings-title" class="w-full max-w-lg rounded-2xl bg-white p-6 text-slate-700 shadow-lg">
    <div class="flex items-center">
      <h2 id="settings-title" class="font-semibold text-slate-900">AI Review settings</h2>
      <button class="ml-auto rounded-lg p-1 text-slate-400 hover:bg-slate-100 hover:text-slate-700" aria-label="Close">✕</button>
    </div>
    <p class="mt-1 text-sm text-slate-500">Reviews run on your OpenRouter account. You pay OpenRouter directly; set a spending limit on the key there.</p>
    <div id="settings-body" class="mt-5 flex flex-col gap-5"></div>
  </div>
</div>

<script>
  // ---------- data ----------
  const SECTIONS = [
    ['problem', 'Problem Space', 4], ['evalOff', 'Evaluation (Offline)', 3], ['baseline', 'Baseline', 5],
    ['validation', 'Validation', 4], ['data', 'Data & Features', 3], ['target', 'Target Solution & Architecture', 5],
    ['evalOn', 'Evaluation (Online)', 4], ['monitoring', 'Monitoring', 3], ['integration', 'Integration', 5],
  ];
  const ORDER = ['problem', 'evalOff', 'baseline', 'validation', 'data', 'evalOn', 'integration', 'monitoring', 'target'];
  const NAME = Object.fromEntries(SECTIONS.map(s => [s[0], s[1]]));
  // Models with image input and structured output, as OpenRouter lists them.
  const MODELS = [
    ['anthropic/claude-sonnet-5.5', 'Claude Sonnet 5.5', 'Recommended'],
    ['anthropic/claude-opus-5.5', 'Claude Opus 5.5', 'Deeper, slower, pricier'],
    ['anthropic/claude-haiku-4.5', 'Claude Haiku 4.5', 'Fast and cheap, shallower'],
  ];

  const SCENES = [
    ['menu-ready', 'AI Review menu'],
    ['menu-nokey', 'Menu: no key'],
    ['menu-guest', 'Menu: guest'],
    ['account', 'Account menu'],
    ['key-empty', 'Settings: add key'],
    ['key-checking', 'Settings: checking'],
    ['key-saved', 'Settings: saved'],
    ['key-bad', 'Settings: key rejected'],
    ['running', 'Review running'],
    ['err-key', 'Error: key rejected'],
    ['err-credits', 'Error: no credits'],
    ['err-rate', 'Error: rate limit'],
    ['err-images', 'Error: model has no image input'],
    ['err-output', 'Error: unreadable answer'],
  ];
  let scene = 'menu-ready';

  // ---------- pieces ----------
  const btnPrimary = 'rounded-lg bg-slate-900 px-3 py-1.5 text-sm font-medium text-white hover:bg-slate-700';
  const btnSecondary = 'rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-sm font-medium text-slate-900 hover:bg-slate-50';
  const link = 'text-sm font-semibold text-indigo-600 hover:text-indigo-700';
  const field = 'w-full rounded-full border border-slate-200 bg-white px-4 py-2 text-sm outline-none focus:border-indigo-300 focus:ring-2 focus:ring-indigo-100';
  const item = 'flex w-full items-center gap-2 rounded-lg px-3 py-2 text-left font-medium hover:bg-slate-100';

  const LENS = '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/>';
  function reviewIndicator(state) {
    const cls = { off: 'text-slate-300', running: 'text-indigo-500 running', red: 'text-red-600', green: 'text-emerald-600' }[state];
    const badge = state === 'red'
      ? '<svg viewBox="0 0 24 24" class="absolute -right-0.5 -bottom-0.5 h-3 w-3 rounded-full bg-red-600 text-white"><path d="M12 6.5v6.5M12 17.5v.01" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>'
      : state === 'green'
        ? '<svg viewBox="0 0 24 24" class="absolute -right-0.5 -bottom-0.5 h-3 w-3 rounded-full bg-emerald-600 text-white"><path d="M6 12l4 4 8-8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>'
        : '';
    return `<span class="relative rounded-md p-1 ${cls}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5">${LENS}</svg>${badge}</span>`;
  }
  // Before this run: a finished review with these states per section.
  const BEFORE = { problem: 'green', evalOff: 'red', baseline: 'green', validation: 'green', data: 'red', target: 'green', evalOn: 'red', monitoring: 'green', integration: 'red' };

  function renderCards() {
    const running = scene === 'running';
    document.getElementById('grid').innerHTML = SECTIONS.map(([sid, name, w]) => `
      <article style="grid-column: span ${w}" class="flex flex-col rounded-2xl border border-slate-200 bg-white shadow-sm">
        <header class="flex items-center gap-2 border-b border-slate-100 px-4 py-3">
          <h3 class="min-w-0 flex-1 text-sm font-semibold uppercase leading-tight tracking-wide text-slate-900">${name}</h3>
          ${reviewIndicator(running ? 'running' : BEFORE[sid])}
        </header>
        <div class="flex flex-col gap-2 px-4 py-4">
          <span class="h-2.5 w-3/4 rounded bg-slate-100"></span><span class="h-2.5 w-1/2 rounded bg-slate-100"></span><span class="h-2.5 w-2/3 rounded bg-slate-100"></span>
        </div>
        <footer class="flex justify-end border-t border-slate-100 px-4 py-3"><button class="${btnPrimary}">Details</button></footer>
      </article>`).join('');
  }

  // ---------- AI Review menu ----------
  function renderMenu() {
    const m = document.getElementById('menu');
    m.hidden = !scene.startsWith('menu-');
    if (m.hidden) return;
    if (scene === 'menu-guest') {
      m.innerHTML = `<div class="flex flex-col gap-3 p-3">
        <p class="font-medium text-slate-900">Sign in to run AI review</p>
        <p class="text-slate-500">The review checks your design against the ML System Design rubric and leaves findings on the fields. It runs on your own OpenRouter key.</p>
        <button class="${btnPrimary} self-start">Sign in with Google</button>
      </div>`;
      return;
    }
    if (scene === 'menu-nokey') {
      m.innerHTML = `<div class="flex flex-col gap-3 p-3">
        <p class="font-medium text-slate-900">Add your OpenRouter key</p>
        <p class="text-slate-500">Reviews run on your OpenRouter account. Add a key once, then run a review from here.</p>
        <button class="${btnPrimary} self-start">Add key</button>
      </div>`;
      return;
    }
    m.innerHTML = `
      <button class="${item}">Review whole design</button>
      <div class="px-3 pt-2 pb-1 text-xs uppercase tracking-wide text-slate-400">Review one section</div>
      <div class="grid grid-cols-1">
        ${ORDER.map(sid => `<button class="${item} font-normal text-slate-700">${NAME[sid]}</button>`).join('')}
      </div>
      <div class="mt-1 flex items-center gap-2 border-t border-slate-100 px-3 py-2 text-xs text-slate-500">
        <span>Claude Sonnet 5.5 · last run 2 min ago</span>
        <button class="ml-auto font-semibold text-indigo-600 hover:text-indigo-700">Settings</button>
      </div>`;
  }

  function renderAccount() {
    document.getElementById('avatar').innerHTML = scene === 'menu-guest'
      ? '<img src="assets/default-avatar.png" alt="Guest" class="mr-2 h-8 w-8 rounded-full object-cover ring-1 ring-slate-200">'
      : `<button class="mr-2 grid h-8 w-8 place-items-center rounded-full bg-indigo-100 text-sm font-semibold text-indigo-700 ${scene === 'account' ? 'ring-2 ring-indigo-300' : ''}" title="Google profile photo">A</button>`;
    const a = document.getElementById('account-menu');
    a.hidden = scene !== 'account';
    a.innerHTML = `
      <div class="px-3 py-2"><div class="text-xs text-slate-500">Signed in as</div><div class="font-medium text-slate-900">you@gmail.com</div></div>
      <div class="my-1 border-t border-slate-100"></div>
      <button class="${item}">My designs</button>
      <button class="${item}">AI Review settings</button>
      <div class="my-1 border-t border-slate-100"></div>
      <button class="${item}">Sign out</button>`;
  }

  // ---------- Settings ----------
  function modelPicker(disabled) {
    return `<div class="flex flex-col gap-1.5">
      <label for="model" class="text-sm font-medium text-slate-900">Model</label>
      <div class="relative">
        <select id="model" ${disabled ? 'disabled' : ''} class="${field} appearance-none pr-10 ${disabled ? 'bg-slate-50 text-slate-400' : ''}">
          ${MODELS.map(([id, name, note], i) => `<option ${i === 0 ? 'selected' : ''} value="${id}">${name} — ${note}</option>`).join('')}
        </select>
        <svg class="pointer-events-none absolute top-1/2 right-4 h-4 w-4 -translate-y-1/2 text-slate-400" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6l4 4 4-4"/></svg>
      </div>
      <p class="text-xs text-slate-500">Only models that read images and return structured answers are listed: the review needs your diagrams.</p>
    </div>`;
  }

  function renderSettings() {
    const wrap = document.getElementById('settings-wrap');
    wrap.hidden = !scene.startsWith('key-');
    if (wrap.hidden) return;
    const keyLabel = '<label for="key" class="text-sm font-medium text-slate-900">OpenRouter key</label>';
    const getKey = `<p class="text-xs text-slate-500">Create one at <span class="select-all font-medium text-slate-700">openrouter.ai/keys</span>. Stored encrypted; the app uses it for reviews and never shows it again.</p>`;
    let keyBlock;
    if (scene === 'key-saved') {
      keyBlock = `<div class="flex flex-col gap-1.5">${keyLabel}
        <div class="flex items-center gap-3 rounded-full border border-slate-200 bg-slate-50 px-4 py-2 text-sm">
          <span class="font-mono text-slate-700">sk-or-v1-••••••••a3f9</span>
          <span class="flex items-center gap-1 text-xs font-medium text-emerald-600">✓ Works</span>
          <button class="ml-auto ${link}">Replace</button>
          <button class="text-sm font-semibold text-red-600 hover:text-red-700">Delete</button>
        </div>
        <p class="text-xs text-slate-500">Added Oct 1, 2026.</p>
      </div>`;
    } else {
      const bad = scene === 'key-bad', checking = scene === 'key-checking';
      keyBlock = `<div class="flex flex-col gap-1.5">${keyLabel}
        <div class="flex gap-2">
          <input id="key" type="password" ${checking ? 'disabled' : ''} value="${scene === 'key-empty' ? '' : 'sk-or-v1-8c2e04f1d9b7a3f9'}" placeholder="sk-or-v1-…"
            class="${field} font-mono ${bad ? 'border-red-300 focus:border-red-300 focus:ring-red-100' : ''} ${checking ? 'bg-slate-50 text-slate-400' : ''}">
          <button class="${btnPrimary} shrink-0 ${checking ? 'opacity-60' : ''}">${checking ? 'Checking…' : 'Save'}</button>
        </div>
        ${bad ? '<p class="text-xs font-medium text-red-600">OpenRouter rejected this key. Check that you copied all of it, or create a new one.</p>' : getKey}
      </div>`;
    }
    document.getElementById('settings-body').innerHTML = keyBlock + modelPicker(scene !== 'key-saved') +
      `<div class="flex justify-end gap-2 border-t border-slate-100 pt-4">
        <button class="${btnSecondary}">Close</button>
        ${scene === 'key-saved' ? `<button class="${btnPrimary}">Review whole design</button>` : ''}
      </div>`;
  }

  // ---------- Review panel ----------
  const dot = sev => `<span class="inline-block h-2 w-2 shrink-0 rounded-full ${{ critical: 'bg-red-600', major: 'border-2 border-red-500', minor: 'bg-slate-400' }[sev]}"></span>`;
  const OLD = [
    ['critical', 'Average check does not measure the stated goal', 'Evaluation (Online) › Key Metric'],
    ['major', 'Out-of-stock is called costlier than overstock, but neither cost is estimated', 'Whole design'],
    ['major', 'Two weightings with no rule for which one decides', 'Evaluation (Offline) › Weighting'],
    ['major', 'Promo calendar may not be final at forecast time', 'Data & Features › Key Features'],
  ];

  const ERRORS = {
    'err-key': ['OpenRouter rejected your key', 'The key was deleted, disabled or mistyped. Your previous findings are unchanged.', 'Replace key'],
    'err-credits': ['Your OpenRouter key is out of credits', 'The key hit its spending limit or the account balance is empty. Top up or raise the limit at openrouter.ai, then run again. Your previous findings are unchanged.', 'Run again'],
    'err-rate': ['OpenRouter is limiting requests', 'Too many requests in a short time. Wait a minute and run again. Your previous findings are unchanged.', 'Run again'],
    'err-images': ['Claude Haiku 4.5 cannot read diagrams', 'This model stopped accepting images. Choose another model in settings. Your previous findings are unchanged.', 'Choose model'],
    'err-output': ['The model\'s answer could not be read', 'It did not match the findings format. This happens now and then; run again or choose a stronger model. Your previous findings are unchanged.', 'Run again'],
  };

  function renderPanel() {
    const p = document.getElementById('panel');
    const show = scene === 'running' || scene.startsWith('err-');
    p.hidden = !show;
    if (!show) return;
    let status;
    if (scene === 'running') {
      status = `<div class="flex flex-col gap-2 rounded-xl border border-indigo-100 bg-indigo-50 px-4 py-3">
        <div class="flex items-center gap-2 text-sm">
          <span class="font-medium text-indigo-700">Reviewing whole design…</span>
          <span class="tabular-nums text-indigo-600">0:24</span>
          <button class="ml-auto text-sm font-semibold text-slate-600 hover:text-slate-900">Cancel</button>
        </div>
        <div class="h-1 overflow-hidden rounded-full bg-indigo-100"><div class="bar h-full w-2/5 rounded-full bg-indigo-400"></div></div>
        <p class="text-xs text-indigo-700/80">Claude Sonnet 5.5 · usually 30–90 s. You can keep editing; fields you change now will be marked “changed since review”.</p>
      </div>`;
    } else {
      const [title, text, action] = ERRORS[scene];
      status = `<div class="flex flex-col gap-2 rounded-xl border border-red-200 bg-white px-4 py-3">
        <div class="flex items-center gap-2"><span class="grid h-4 w-4 place-items-center rounded-full bg-red-600 text-[10px] font-bold text-white">!</span><span class="text-sm font-medium text-slate-900">${title}</span></div>
        <p class="text-sm text-slate-600">${text}</p>
        <div class="flex justify-end gap-2"><button class="${btnPrimary}">${action}</button></div>
      </div>`;
    }
    const old = OLD.map(([sev, t, where]) => `<div class="flex items-start gap-2.5 px-3 py-2.5">
      <span class="mt-1.5">${dot(sev)}</span>
      <span class="min-w-0"><span class="block text-sm font-medium text-slate-900">${t}</span><span class="text-xs text-slate-500"><span class="capitalize">${sev}</span> · ${where}</span></span>
    </div>`).join('');
    p.innerHTML = `
      <div class="flex flex-col gap-3 border-b border-slate-100 px-5 py-4">
        <div class="flex items-center gap-2">
          <h2 class="font-semibold text-slate-900">Review</h2>
          <span class="text-xs text-slate-400">${scene === 'running' ? 'Whole design · running' : 'Whole design · failed just now'}</span>
          <button class="ml-auto rounded-lg px-1.5 py-1 text-slate-400 hover:bg-slate-100 hover:text-slate-700" aria-label="Close review">✕</button>
        </div>
        ${status}
      </div>
      <div class="min-h-0 flex-1 overflow-y-auto px-3 py-3 ${scene === 'running' ? 'opacity-50' : ''}">
        <p class="px-3 pb-2 text-xs text-slate-500">${scene === 'running' ? 'Previous findings · replaced when this review finishes' : 'Previous findings · from the review 2 min ago'}</p>
        ${old}
        <p class="px-3 pt-1 text-xs text-slate-400">+ 9 more</p>
      </div>`;
  }

  // ---------- scenes ----------
  function render() {
    document.getElementById('scenes').innerHTML = '<span class="mr-1 uppercase tracking-wide">Mockup scene</span>' + SCENES.map(([k, label]) =>
      `<button data-scene="${k}" class="rounded-lg px-2 py-1 font-medium ${k === scene ? 'bg-indigo-50 text-indigo-700' : 'text-slate-500 hover:bg-slate-100'}">${label}</button>`).join('');
    document.querySelectorAll('[data-scene]').forEach(b => b.onclick = () => { scene = b.dataset.scene; render(); });
    document.getElementById('ai-btn').className = `rounded-lg border px-3 py-1.5 text-sm font-medium hover:bg-slate-50 ${scene.startsWith('menu-') ? 'border-indigo-300 bg-indigo-50 text-indigo-700' : 'border-slate-200 bg-white text-slate-900'}`;
    renderCards(); renderMenu(); renderAccount(); renderSettings(); renderPanel();
  }
  render();
</script>
