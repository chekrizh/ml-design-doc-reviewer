elay. The outer loop estimates quality, the inner loop tunes hyperparameters and selects features. The split moves weekly with new data; a golden set tracks long-term progress.", "trade": [["Option", "Respects time order", "Handles 48 h data delay", "Gives variance of the estimate"], ["Random K-fold", "No, leaks the future", "No", "Yes"], ["Single time holdout", "Yes", "Yes, with a gap", "No"], ["Rolling CV with a gap", "Yes", "Yes", "Yes"]], "chosen": "Rolling CV with a gap", "diagram": "A horizontal timeline of the outer loop, three stacked rows, each shifted left by 7 days:\n\n- Fold 1: [Train 2 years] → [Gap 3 days] → [Test 28 days]\n- Fold 2: [Train 2 years] → [Gap 3 days] → [Test 28 days]\n- Fold 5: [Train 2 years] → [Gap 3 days] → [Test 28 days]"}, {"name": "Data & Features", "props": [["Sources", "Transactions, stock, promo calendar, metadata"], ["Key Features", "Sales lags and rolling stats, prices, promo, penetration"], ["Object", "(date, store, SKU) → units sold"], ["External Data", "Competitor prices, weather, traffic"]], "rationale": "Transactions are the primary source of truth, stock history shows how much could be sold, the promo calendar drives spikes. Purchased weather and traffic data and manually gathered competitor prices (about 25% of SKUs, with gaps) come from outside. History covers more than three years; labels come from transactions, so no extra labeling is needed.\n\nFeatures are kept only if they pass four criteria: prediction quality, interpretability, computation time, and stability of their sources. A feature that improves quality but takes two days to compute is rejected. Each feature is a hypothesis, importance is checked with SHAP and shuffle importance, and feature tests run before and after training.", "trade": [], "chosen": null, "diagram": "A horizontal ETL pipeline:\n\n- [Daily transaction aggregates] → [Rewrite last 2–3 days] → [Join stock, promo, metadata, external data] → [Feature store (store × SKU × day)]"}, {"name": "Evaluation (Online)", "props": [["Evaluation Type", "A/B test split by distribution center"], ["Key Metric", "Average check, proxy for revenue"], ["Hypothesis", "Revenue +0.3% or more"], ["Design", "Welch's t-test, α 5%, β 10%, 1 month"]], "rationale": "Offline gains translate into an expected 0.3–0.7% revenue increase in the pilot group, based on earlier A/B tests. The split unit is the distribution center: each center serves a cluster of stores, so splitting by store would mix groups within one replenishment chain. Two weeks are enough statistically, but replenishment runs weekly, so the test lasts a full month. Control metrics: checks per day, model update frequency, offline metrics. Auxiliary: daily revenue and profit.", "trade": [["Option", "Groups independent", "Enough units for power"], ["Split by store", "No, stores share a distribution center", "Yes"], ["Split by distribution center", "Yes", "Enough with matched store subsets"]], "chosen": "Split by distribution center", "diagram": "None."}, {"name": "Integration", "props": [["Inference Pattern", "Scheduled batch jobs, on-demand via API"], ["Output", "Demand per SKU × entity × period, JSON"], ["Latency Budget", "Not critical, batch throughput matters"], ["Fallback", "3 tiers down to last week's sales"]], "rationale": "Forecasts run daily, weekly, and monthly on large volumes: batch containers on AWS Batch read from S3 and write back to S3, a small API serves on-demand requests. When drift or data problems appear, the system switches automatically: a model on the most important features, then SARIMA or Prophet, then last week's sales adjusted for holidays. The wrapper and the model are released separately; a new model runs in shadow mode first. Users are internal, so blue-green deployment is not needed; overrides and feedback stay with business users.", "trade": [["Option", "Risk for users", "Effort"], ["Blue-green deployment", "Low", "High"], ["Standard rollout + shadow mode for models", "Low, users are internal", "Low"]], "chosen": "Standard rollout + shadow mode for models", "diagram": "A horizontal batch flow with a fallback chain below it:\n\n- [S3 input data] → [AWS Batch forecast job] → [S3 forecasts] → [Demand API]\n- [Main model] → [Model on top features] → [SARIMA / Prophet] → [Last week's sales]"}, {"name": "Monitoring", "props": [["Data Drift", "Wasserstein distance, mean drift score"], ["Model Quality", "Quantile losses daily, labels in 15 min"], ["Alerting", "z-score on missing data, prediction drift"], ["Tooling", "Evidently AI, ClickHouse, Prometheus, Grafana"]], "rationale": "This is one of the first ML projects at Supermegaretail, so there is no ML monitoring yet. Labels arrive 15 minutes after a sale, so model quality is monitored directly: the six quantile losses, RMSE, and MAE, with thresholds set after the first three months. Data quality alerts fire at 3 z-scores for important features and 4 for the rest; schema, ranges, and correlations are checked too. Prediction drift is an early alarm (PSI > 0.2 and Wasserstein > 0.1 are both tested). Business metrics stay on rotating A/B groups.", "trade": [["Option", "Time to start", "Covers quality, data and target drift", "Control"], ["Evidently AI (open source)", "Days", "Yes", "Medium"], ["Own monitoring platform", "Months", "Whatever we build", "Full"]], "chosen": "Evidently AI (open source)", "diagram": "None."}, {"name": "Target Solution & Architecture", "props": [["Model Type", "Gradient boosting, one model per quantile"], ["Scope", "One model for all categories"], ["Training Stack", "Python, Spark, MLflow, Docker, SageMaker"]], "rationale": "Six gradient-boosting models, one per quantile, trained with quantile loss on the feature store. Replacing per-category models with one unified model improved offline metrics across most folds; small categories gained most, large ones did not lose, and the result held across seasons and regions. One model is also much easier to maintain. Learning curves pick the nu           : `<button data-fix="${f.id}" class="self-start text-sm font-semibold text-indigo-600 hover:text-indigo-700">Show fix</button>`}
        <div class="flex justify-end gap-2 border-t border-slate-100 pt-3">
          <button data-status="${f.id}:dismissed" class="rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-sm font-medium text-slate-900 hover:bg-slate-50">Dismiss</button>
          <button data-status="${f.id}:resolved" class="rounded-lg bg-slate-900 px-3 py-1.5 text-sm font-medium text-white hover:bg-slate-700">Resolve</button>
        </div>
      </div>`;
    } else {
      body = `<p class="clamp2 mt-1.5 text-sm text-slate-500">${f.evidence}</p>`;
    }
    return `<div data-comment="${f.id}" class="comment absolute inset-x-0 rounded-xl border bg-white px-3 py-2.5 ${isOpen ? 'z-10 border-slate-200 shadow-lg' : 'border-slate-200 shadow-sm'} ${f.stale ? 'opacity-70' : ''}">
      <button data-open="${f.id}" class="flex w-full items-start gap-2.5 text-left">
        <span class="mt-1.5">${dot(f.sev)}</span>
        <span class="min-w-0 flex-1">
          <span class="block text-sm font-medium ${f.status === 'open' ? 'text-slate-900' : 'text-slate-500'}">${f.title}</span>
          <span class="mt-0.5 flex flex-wrap items-center gap-x-2 gap-y-1 text-xs text-slate-500"><span class="capitalize">${f.sev}</span><span>·</span><span>${where}</span>${stale}</span>
        </span>
      </button>${body}
    </div>`;
  }

  // Google Docs layout: each comment at its field's height, pushed down on overlap;
  // the active one sits exactly at its field and the ones above move up to make room.
  function layout() {
    const margin = document.getElementById('margin');
    const base = margin.getBoundingClientRect().top;
    const items = [...margin.querySelectorAll('[data-comment]')].map(el => {
      const f = F.find(x => x.id === el.dataset.comment);
      return { el, f, anchor: anchorEl(f).getBoundingClientRect().top - base, h: el.offsetHeight };
    }).sort((a, b) => a.anchor - b.anchor || SEV_RANK[a.f.sev] - SEV_RANK[b.f.sev]);
    let y = 0;
    items.forEach(it => { it.y = Math.max(it.anchor, y); y = it.y + it.h + 8; });
    const ai = items.findIndex(it => it.f.id === active);
    if (ai >= 0) {
      items[ai].y = items[ai].anchor;
      for (let i = ai - 1; i >= 0; i--) items[i].y = Math.min(items[i].y, items[i + 1].y - items[i].h - 8);
      for (let i = ai + 1; i < items.length; i++) items[i].y = Math.max(items[i].anchor, items[i - 1].y + items[i - 1].h + 8);
    }
    items.forEach(it => it.el.style.top = it.y + 'px');
    margin.style.height = (items.length ? Math.max(...items.map(it => it.y + it.h)) : 0) + 'px';

    document.querySelectorAll('.hl').forEach(el => el.classList.remove('hl'));
    const a = F.find(x => x.id === active);
    if (a && a.status === 'open' && a.section !== 'design') anchorEl(a).classList.add('hl');
  }

  function renderMargin() {
    const open = F.filter(f => f.status === 'open');
    document.getElementById('summary').innerHTML =
      ['critical', 'major', 'minor'].map(s => `<span class="flex items-center gap-1.5">${dot(s)}<span class="tabular-nums font-medium text-slate-900">${open.filter(f => f.sev === s).length}</span> ${s}</span>`).join('');
    document.getElementById('tabs').innerHTML = [['open', 'Open'], ['resolved', 'Resolved'], ['dismissed', 'Dismissed']].map(([k, label]) =>
      `<button data-tab="${k}" class="rounded-lg px-2.5 py-1 ${tab === k ? 'bg-indigo-50 font-medium text-indigo-700' : 'text-slate-500 hover:bg-slate-100'}">${label} <span class="tabular-nums">${F.filter(f => f.status === k).length}</span></button>`).join('');
    document.getElementById('margin').innerHTML = F.filter(f => f.status === tab).map(comment).join('');
    layout();

    const on = (sel, fn) => document.querySelectorAll(sel).forEach(el => el.onclick = () => fn(el));
    on('[data-tab]', el => { tab = el.dataset.tab; renderMargin(); });
    on('[data-open]', el => { active = active === el.dataset.open ? null : el.dataset.open; renderMargin(); });
    on('[data-fix]', el => { fixShown.add(el.dataset.fix); renderMargin(); });
    on('[data-status]', el => {
      const [id, st] = el.dataset.status.split(':');
      F.find(x => x.id === id).status = st;
      if (active === id) active = null;
      renderSheet(); renderMargin();
    });
  }

  renderSheet();
  renderMargin();
  // Heights change when styles load, fonts swap or a comment expands: lay out again each time.
  let queued = false;
  const relayout = () => { if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; layout(); }); } };
  new ResizeObserver(relayout).observe(document.getElementById('sheet'));
  new MutationObserver(() => document.querySelectorAll('[data-comment]').forEach(el => ro.observe(el))).observe(document.getElementById('margin'), { childList: true });
  const ro = new ResizeObserver(relayout);
  document.querySelectorAll('[data-comment]').forEach(el => ro.observe(el));
  // Start scrolled to the active comment, as if the user clicked it.
  addEventListener('load', () => setTimeout(() => {
    const first = F.find(f => f.id === active);
    if (first) anchorEl(first).scrollIntoView({ block: 'center' });
  }, 300));
</script>
